[project]
name = "usbip"
version = "0.1.0"
description = "USB/IP toolset: auto-export, stale-export recovery, transfer splitting, short-packet fix"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.16.0",
    "toml>=0.10.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
usbip = "usbip.__main__:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["usbip", "usbip_core", "usbip_modules"]
